name: trustless-build
description: >-
  Configure a GitHub runner to use a Trustless Nix cache, then run a build
  command (default `nix flake check`).

inputs:
  command:
    description: Command to run after configuring the cache.
    required: false
    default: nix flake check
  working-directory:
    description: Working directory for `command`.
    required: false
    default: .
  org-slug:
    description: >-
      Trustless organisation slug that owns the cache. Required: the OIDC token
      is verified against this org's source-code-manager and the repo must
      match one of the org's cache access rules.
    required: true
  api-endpoint:
    description: Trustless API endpoint (OIDC → SSH key exchange).
    required: false
    default: https://www.trustless.build/api
  ssh-host:
    description: SSH host used for `credential_process` and `known_hosts`.
    required: false
    default: trustless.build
  audience:
    description: >-
      OIDC audience claim requested from GitHub. Must match the value Trustless
      enforces (`trustless.build`); the server rejects tokens with any other
      audience.
    required: false
    default: trustless.build
  aws-config-path:
    description: Path the AWS `[profile …]` block is written to. Read by the nix daemon (root) for substituter credential minting.
    required: false
    default: /root/.aws/config
  nix-conf-path:
    description: Path the `extra-substituters` + `extra-trusted-public-keys` lines are appended to.
    required: false
    default: /etc/nix/nix.conf
  github-token:
    description: >-
      Token used to download this action's release asset. The default job
      `GITHUB_TOKEN` works when the action's repo is public, or same-repo as
      the caller. For a private action repo consumed from a different repo
      (even within the same org), supply a PAT or fine-grained token with
      `Contents:read` on the action's repo via `secrets.…`.
    required: false
    default: ${{ github.token }}
  versioned-packages:
    description: >-
      Space-separated package attribute names to publish as trustless version
      pointers after a successful build (resolved as `<versioned-flake>#<name>`).
      Leave empty to publish nothing. The ref is taken from the run's OIDC token,
      not from here.
    required: false
    default: ""
  versioned-nixos-configurations:
    description: >-
      Space-separated nixosConfiguration names to publish as version pointers
      (resolved via `.config.system.build.toplevel`).
    required: false
    default: ""
  versioned-flake:
    description: Flake reference to evaluate versioned outputs from.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Download trustless-provisioner
      shell: bash
      env:
        # Resolved from the expression context, which is reliably populated in
        # composite actions — the `GITHUB_ACTION_REPOSITORY` env var has been
        # known to expand empty, in which case we'd infer the wrong repo.
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -z "$ACTION_REPO" ] || [ -z "$ACTION_REF" ]; then
          echo "ERROR: github.action_repository or github.action_ref is empty; refusing to guess." >&2
          exit 1
        fi
        bindir="${RUNNER_TEMP}/trustless-build"
        mkdir -p "$bindir"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) asset="trustless-provisioner-x86_64-linux" ;;
          aarch64) asset="trustless-provisioner-aarch64-linux" ;;
          *) echo "unsupported arch: $arch" >&2; exit 1 ;;
        esac
        api="https://api.github.com/repos/${ACTION_REPO}"
        auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
        # Resolve the release by tag via the API. We download via the asset's
        # API URL (Accept: application/octet-stream) rather than the
        # github.com/.../releases/download/<tag>/<asset> browser URL, because
        # that browser URL is not authorizable with a bearer token and 404s
        # for private action repos. This mirrors what `gh release download`
        # does internally — no `gh` needed, so it works on the bare
        # actions/runner-based trustless AMI.
        rel="${RUNNER_TEMP}/trustless-release.json"
        code="$(curl -sS -w '%{http_code}' -o "$rel" \
          "${auth[@]}" -H "Accept: application/vnd.github+json" \
          "${api}/releases/tags/${ACTION_REF}")"
        if [ "$code" != "200" ]; then
          echo "ERROR: GitHub API returned HTTP $code fetching release tag '$ACTION_REF' from '$ACTION_REPO'." >&2
          echo "If the action repo is private and consumed from another repo, supply a token with Contents:read via the 'github-token' input." >&2
          cat "$rel" >&2 || true
          exit 1
        fi
        # Find the API URL of the asset whose name matches exactly. Parsed with
        # awk (always present) to avoid a jq dependency the AMI may not have.
        asset_url="$(awk -v want="$asset" '
          /"url":/ { if (match($0, /https:\/\/api\.github\.com\/repos\/[^"]*\/releases\/assets\/[0-9]+/)) u = substr($0, RSTART, RLENGTH) }
          /"name":/ { line = $0; sub(/^[^:]*:[[:space:]]*"/, "", line); sub(/".*/, "", line); if (line == want) { print u; exit } }
        ' "$rel")"
        if [ -z "$asset_url" ]; then
          echo "ERROR: asset '$asset' not found in release '$ACTION_REF' of '$ACTION_REPO'. Available assets:" >&2
          grep -o '"name": *"[^"]*"' "$rel" >&2 || true
          exit 1
        fi
        curl -fsSL -o "$bindir/trustless-provisioner" \
          "${auth[@]}" -H "Accept: application/octet-stream" \
          "$asset_url"
        chmod +x "$bindir/trustless-provisioner"
        echo "$bindir" >> "$GITHUB_PATH"

    - name: Exchange OIDC token + write cache config
      shell: bash
      env:
        TRUSTLESS_API_ENDPOINT: ${{ inputs.api-endpoint }}
        TRUSTLESS_SSH_HOST: ${{ inputs.ssh-host }}
      run: |
        set -euo pipefail
        sudo -E "$(command -v trustless-provisioner)" auth \
          --org-slug "${{ inputs.org-slug }}" \
          --audience "${{ inputs.audience }}" \
          --aws-config-path "${{ inputs.aws-config-path }}" \
          --nix-conf-path "${{ inputs.nix-conf-path }}" \
          --output-dir /root/.ssh

    - name: Install SSH key + known_hosts for the runner user
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
      run: |
        set -euo pipefail
        # The provisioner writes to root (daemon reads /root/.aws/config +
        # /etc/nix/nix.conf for substituter auth), but the `nix build
        # --store ssh-ng://…` step runs as the runner user and so reads
        # ~/.ssh from the runner's home. Copy the ephemeral key and append
        # the trustless host-key line idempotently.
        mkdir -p "$HOME/.ssh"
        chmod 0700 "$HOME/.ssh"
        uid="$(id -u)"
        gid="$(id -g)"
        sudo install -m 0600 -o "$uid" -g "$gid" \
          /root/.ssh/id_ed25519 "$HOME/.ssh/id_ed25519"
        sudo install -m 0644 -o "$uid" -g "$gid" \
          /root/.ssh/id_ed25519.pub "$HOME/.ssh/id_ed25519.pub"
        touch "$HOME/.ssh/known_hosts"
        # Extract just the line(s) for our SSH host from root's known_hosts
        # and append to the user's if not already present.
        sudo grep -h "^${SSH_HOST} " /root/.ssh/known_hosts \
          | while IFS= read -r line; do
              grep -qxF "$line" "$HOME/.ssh/known_hosts" \
                || echo "$line" >> "$HOME/.ssh/known_hosts"
            done

    - name: Restart nix-daemon
      shell: bash
      run: |
        set -euo pipefail
        # The DeterminateSystems / cachix installer units don't declare
        # ExecReload, so `systemctl reload` always errors — use restart
        # unconditionally. Restart is fast (~100ms) and there are no
        # in-flight builds to interrupt at this point in the action.
        if systemctl list-unit-files nix-daemon.service >/dev/null 2>&1; then
          sudo systemctl restart nix-daemon
        else
          sudo pkill -HUP nix-daemon || true
        fi

    - name: Run build command
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # The `--store ssh-ng://…` and `--eval-store auto` flags are appended
      # to the command. This assumes `command` is a single nix invocation
      # (the default is `nix flake check`). If you need to run multiple
      # commands or wrap in a shell script, invoke nix yourself with these
      # flags and leave `command` pointing at the outer script.
      run: ${{ inputs.command }} --store ssh-ng://${{ inputs.ssh-host }} --eval-store auto

    - name: Publish versioned outputs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PKGS: ${{ inputs.versioned-packages }}
        CFGS: ${{ inputs.versioned-nixos-configurations }}
        FLAKE: ${{ inputs.versioned-flake }}
        SSH_HOST: ${{ inputs.ssh-host }}
      # Resolve the declared outputs to store paths and publish ref->path
      # pointers. The build above must have realised (and thus cached) these
      # paths via the ssh-ng store — `push-version` rejects uncached outputs.
      # The ref and repository come from the OIDC-bound key, so this can only
      # move the pointer for the ref this run actually ran on.
      run: |
        set -euo pipefail
        if [ -z "$PKGS" ] && [ -z "$CFGS" ]; then
          echo "No versioned outputs declared; skipping."
          exit 0
        fi
        args=(push-versions --flake "$FLAKE" --ssh-host "$SSH_HOST")
        for p in $PKGS; do args+=(--package "$p"); done
        for c in $CFGS; do args+=(--nixos-configuration "$c"); done
        "$(command -v trustless-provisioner)" "${args[@]}"
